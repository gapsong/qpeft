# Lint and the fast test suite on every push and pull request.
# The slow tests (QPEFT_RUN_SLOW=1: model downloads, CUDA kernels) do not run here.
name: tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        # CPU torch: the default Linux wheel pulls several GB of CUDA libraries.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" ruff==0.15.12
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
