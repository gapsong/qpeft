[project]
name = "qpeft"
version = "0.0.1"
description = "Quantization-aware, PEFT-style tuning whose merge stays quantized."
requires-python = ">=3.10"
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
torchao = ["torchao>=0.7"]           # real schemes/kernels bind to torchao
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qpeft*"]
